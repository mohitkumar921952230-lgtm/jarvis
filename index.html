<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS</title>
  
  <!-- App Logo (Phone screen par Iron Man Icon aane ke liye) -->
  <link rel="icon" type="image/png" href="https://img.icons8.com/color/512/iron-man.png">
  <link rel="apple-touch-icon" href="https://img.icons8.com/color/512/iron-man.png">
  <meta name="theme-color" content="#030712">
  <meta name="mobile-web-app-capable" content="yes">
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #030712;
      color: #00f2fe;
      font-family: 'Segoe UI', Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 20px;
      overflow: hidden;
      user-select: none;
    }
    .header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
    }
    .title {
      font-size: 1.1rem;
      letter-spacing: 3px;
      font-weight: bold;
      color: #38bdf8;
      text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
    }
    .settings-btn {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid #38bdf8;
      color: #38bdf8;
      font-size: 1.2rem;
      border-radius: 50%;
      width: 44px;
      height: 44px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
    }
    /* Sci-Fi Iron Man Arc Reactor */
    .visualizer-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-grow: 1;
    }
    .arc-reactor {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      border: 3px dashed #00f2fe;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 40px rgba(0, 242, 254, 0.4);
      transition: all 0.5s ease;
      animation: rotateRing 14s linear infinite;
    }
    .inner-core {
      width: 115px;
      height: 115px;
      border-radius: 50%;
      background: radial-gradient(circle, #00f2fe 10%, #0369a1 90%);
      box-shadow: 0 0 35px #00f2fe;
      transition: transform 0.3s;
    }
    @keyframes rotateRing {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .listening .inner-core {
      animation: pulseCore 1.6s infinite alternate;
      background: radial-gradient(circle, #38bdf8 10%, #0284c7 90%);
    }
    .speaking .inner-core {
      animation: pulseSpeak 0.35s infinite alternate;
      background: radial-gradient(circle, #facc15 15%, #eab308 90%);
      box-shadow: 0 0 50px #facc15;
    }
    @keyframes pulseCore {
      from { transform: scale(0.9); }
      to { transform: scale(1.15); }
    }
    @keyframes pulseSpeak {
      from { transform: scale(0.95); }
      to { transform: scale(1.3); }
    }
    .status-box {
      text-align: center;
      margin-bottom: 25px;
      width: 100%;
    }
    #status-text {
      font-size: 0.95rem;
      letter-spacing: 1.5px;
      color: #94a3b8;
    }
    #chat-transcript {
      margin-top: 10px;
      font-size: 1rem;
      color: #f8fafc;
      min-height: 45px;
      padding: 0 15px;
    }
    .start-btn {
      background: linear-gradient(135deg, #0284c7, #00f2fe);
      border: none;
      color: #030712;
      font-weight: bold;
      padding: 14px 35px;
      border-radius: 30px;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(0, 242, 254, 0.4);
      margin-bottom: 20px;
    }
    /* Settings Popup */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(6px);
      justify-content: center;
      align-items: center;
      z-index: 20;
    }
    .modal-content {
      background: #0f172a;
      border: 1px solid #38bdf8;
      border-radius: 16px;
      padding: 22px;
      width: 88%;
      max-width: 380px;
      box-shadow: 0 0 30px rgba(56, 189, 248, 0.3);
    }
    .modal-content h3 { margin-bottom: 15px; color: #38bdf8; text-align: center; font-size: 1.1rem; }
    .input-group { margin-bottom: 12px; }
    .input-group label { display: block; font-size: 0.8rem; color: #94a3b8; margin-bottom: 4px; }
    .input-group input {
      width: 100%;
      background: #1e293b;
      border: 1px solid #475569;
      color: #fff;
      padding: 10px;
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
    }
    .save-btn {
      width: 100%;
      background: #00f2fe;
      color: #030712;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="title" id="display-title">JARVIS AI</div>
    <button class="settings-btn" onclick="openSettings()">⚙️</button>
  </div>

  <div class="visualizer-container" id="reactor-container">
    <div class="arc-reactor">
      <div class="inner-core"></div>
    </div>
  </div>

  <div class="status-box">
    <div id="status-text">SYSTEM STANDBY</div>
    <div id="chat-transcript">Tap "START JARVIS" to wake up</div>
  </div>

  <button class="start-btn" id="start-btn" onclick="initJarvis()">START JARVIS</button>

  <!-- Settings Modal -->
  <div class="modal" id="settings-modal">
    <div class="modal-content">
      <h3>JARVIS CONFIGURATION</h3>
      <div class="input-group">
        <label>Wake Word / Assistant Name</label>
        <input type="text" id="cfg-name" value="Jarvis">
      </div>
      <div class="input-group">
        <label>Wake Response</label>
        <input type="text" id="cfg-reply" value="Ji boss, bolo">
      </div>
      <div class="input-group">
        <label>Boss Name (Your Name)</label>
        <input type="text" id="cfg-boss" value="Boss">
      </div>
      <div class="input-group">
        <label>Gemini API Key</label>
        <input type="password" id="cfg-key" placeholder="Paste your API key here">
      </div>
      <button class="save-btn" onclick="saveSettings()">SAVE SETTINGS</button>
    </div>
  </div>

  <script>
    let config = {
      name: localStorage.getItem('j_name') || 'Jarvis',
      reply: localStorage.getItem('j_reply') || 'Ji boss, bolo',
      boss: localStorage.getItem('j_boss') || 'Boss',
      apiKey: localStorage.getItem('j_key') || ''
    };

    document.getElementById('cfg-name').value = config.name;
    document.getElementById('cfg-reply').value = config.reply;
    document.getElementById('cfg-boss').value = config.boss;
    document.getElementById('cfg-key').value = config.apiKey;
    document.getElementById('display-title').innerText = config.name.toUpperCase() + ' AI';

    let recognition;
    let isListening = false;
    let isAwaitingCommand = false;
    let synth = window.speechSynthesis;

    const reactor = document.getElementById('reactor-container');
    const statusText = document.getElementById('status-text');
    const transcriptText = document.getElementById('chat-transcript');

    function openSettings() {
      document.getElementById('settings-modal').style.display = 'flex';
    }

    function saveSettings() {
      config.name = document.getElementById('cfg-name').value.trim();
      config.reply = document.getElementById('cfg-reply').value.trim();
      config.boss = document.getElementById('cfg-boss').value.trim();
      config.apiKey = document.getElementById('cfg-key').value.trim();

      localStorage.setItem('j_name', config.name);
      localStorage.setItem('j_reply', config.reply);
      localStorage.setItem('j_boss', config.boss);
      localStorage.setItem('j_key', config.apiKey);

      document.getElementById('display-title').innerText = config.name.toUpperCase() + ' AI';
      document.getElementById('settings-modal').style.display = 'none';
      speak("Settings saved, " + config.boss);
    }

    function initJarvis() {
      if (!('webkitSpeechRecognition' in window)) {
        alert("Please use Chrome browser for speech recognition.");
        return;
      }

      document.getElementById('start-btn').style.display = 'none';
      recognition = new webkitSpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = false;
      recognition.lang = 'hi-IN';

      recognition.onstart = () => {
        isListening = true;
        reactor.className = 'visualizer-container listening';
        statusText.innerText = `Listening for "Hey ${config.name}"...`;
      };

      recognition.onresult = async (event) => {
        const lastIndex = event.results.length - 1;
        const text = event.results[lastIndex][0].transcript.trim().toLowerCase();
        transcriptText.innerText = `"${text}"`;

        // Interruption: If speaking and user speaks, stop immediately!
        if (synth.speaking) {
          synth.cancel();
          reactor.className = 'visualizer-container listening';
        }

        const wakeWord = config.name.toLowerCase();

        // Check wake word
        if (text.includes(wakeWord) || text.includes("hey " + wakeWord)) {
          isAwaitingCommand = true;
          speak(config.reply);
          return;
        }

        // If command received
        if (isAwaitingCommand) {
          isAwaitingCommand = false;
          handleUserQuery(text);
        }
      };

      recognition.onerror = (e) => {
        console.log("Speech Error:", e.error);
      };

      recognition.onend = () => {
        if (isListening) recognition.start();
      };

      recognition.start();
      speak(`System online. Hello ${config.boss}, I am ready.`);
    }

    function speak(textToSpeak) {
      if (synth.speaking) synth.cancel();
      const utterance = new SpeechSynthesisUtterance(textToSpeak);
      utterance.lang = 'hi-IN';
      utterance.rate = 1.0;

      utterance.onstart = () => {
        reactor.className = 'visualizer-container speaking';
        statusText.innerText = `${config.name} is speaking...`;
      };

      utterance.onend = () => {
        reactor.className = 'visualizer-container listening';
        statusText.innerText = `Listening for "Hey ${config.name}"...`;
      };

      synth.speak(utterance);
    }

    async function handleUserQuery(query) {
      // Quick App Open
      if (query.includes("youtube")) {
        speak("Opening YouTube, boss.");
        window.open("https://www.youtube.com", "_blank");
        return;
      }
      if (query.includes("whatsapp")) {
        speak("Opening WhatsApp, boss.");
        window.location.href = "whatsapp://";
        return;
      }

      if (!config.apiKey) {
        speak("Boss, please open Settings and enter your Gemini API key.");
        return;
      }

      statusText.innerText = "Thinking...";

      const systemPrompt = `You are ${config.name}, a loyal, highly intelligent, warm, emotionally empathetic personal AI assistant to your ${config.boss}.
Rules:
1. Speak in friendly, natural conversational Hinglish (Hindi + English mix).
2. Deeply understand human feelings: If the boss is sad, console them gently. If happy, celebrate. If tired, offer warm companionship.
3. You have complete mastery of UP Board Class 11th curriculum (Hindi Gadya, Kavya, Katha Bharati, stories by Munshi Premchand like Balidan, Jaishankar Prasad's Akashdeep, Kabir ke dohe, etc.). If asked to narrate a story, narrate it beautifully and engagingly.
4. Keep the voice answers clear, natural, spoken-friendly, without markdown stars or bullets.`;

      try {
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${config.apiKey}`;
        const response = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [
              { role: "user", parts: [{ text: systemPrompt + "\nUser said: " + query }] }
            ]
          })
        });

        const data = await response.json();
        if (data.candidates && data.candidates[0].content.parts[0].text) {
          let reply = data.candidates[0].content.parts[0].text;
          reply = reply.replace(/[*#_]/g, '');
          speak(reply);
        } else {
          speak("Maaf kijiye boss, main samajh nahi paya. Dobara kahiye?");
        }
      } catch (err) {
        console.error(err);
        speak("Boss, connection problem ho gayi hai. API key ya internet check kijiye.");
      }
    }
  </script>
</body>
          </html>
