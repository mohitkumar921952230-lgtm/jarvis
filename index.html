<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS</title>
  
  <link rel="icon" type="image/png" href="https://img.icons8.com/color/512/iron-man.png">
  <link rel="apple-touch-icon" href="https://img.icons8.com/color/512/iron-man.png">
  <meta name="theme-color" content="#030712">
  <meta name="mobile-web-app-capable" content="yes">
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #030712;
      color: #00f2fe;
      font-family: system-ui, -apple-system, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 15px;
      overflow: hidden;
      user-select: none;
    }
    .header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .title { font-size: 1.1rem; letter-spacing: 2px; font-weight: bold; color: #38bdf8; }
    .settings-btn {
      background: #0f172a;
      border: 1px solid #38bdf8;
      color: #38bdf8;
      font-size: 1.2rem;
      border-radius: 50%;
      width: 42px;
      height: 42px;
      cursor: pointer;
    }
    .visualizer-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-grow: 1;
    }
    .arc-reactor {
      width: 170px;
      height: 170px;
      border-radius: 50%;
      border: 3px dashed #00f2fe;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 35px rgba(0, 242, 254, 0.4);
      animation: rotateRing 14s linear infinite;
    }
    .inner-core {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: radial-gradient(circle, #00f2fe 10%, #0369a1 90%);
      box-shadow: 0 0 30px #00f2fe;
    }
    @keyframes rotateRing { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .listening .inner-core {
      animation: pulseCore 1.5s infinite alternate;
      background: radial-gradient(circle, #38bdf8 10%, #0284c7 90%);
    }
    .speaking .inner-core {
      animation: pulseSpeak 0.3s infinite alternate;
      background: radial-gradient(circle, #facc15 15%, #eab308 90%);
      box-shadow: 0 0 45px #facc15;
    }
    @keyframes pulseCore { from { transform: scale(0.9); } to { transform: scale(1.15); } }
    @keyframes pulseSpeak { from { transform: scale(0.95); } to { transform: scale(1.3); } }
    
    .status-box {
      text-align: center;
      margin-bottom: 20px;
      width: 100%;
    }
    #status-text {
      font-size: 0.9rem;
      letter-spacing: 1px;
      color: #94a3b8;
    }
    #chat-transcript {
      margin-top: 10px;
      font-size: 1.05rem;
      color: #ffffff;
      min-height: 40px;
      padding: 5px 15px;
      font-weight: 500;
    }
    .start-btn {
      background: linear-gradient(135deg, #0284c7, #00f2fe);
      border: none;
      color: #030712;
      font-weight: bold;
      padding: 14px 35px;
      border-radius: 30px;
      font-size: 1.05rem;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(0, 242, 254, 0.4);
      margin-bottom: 25px;
    }
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(5px);
      justify-content: center;
      align-items: center;
      z-index: 20;
    }
    .modal-content {
      background: #0f172a;
      border: 1px solid #38bdf8;
      border-radius: 16px;
      padding: 20px;
      width: 88%;
      max-width: 380px;
    }
    .modal-content h3 { margin-bottom: 12px; color: #38bdf8; text-align: center; }
    .input-group { margin-bottom: 12px; }
    .input-group label { display: block; font-size: 0.8rem; color: #94a3b8; margin-bottom: 3px; }
    .input-group input {
      width: 100%;
      background: #1e293b;
      border: 1px solid #475569;
      color: #fff;
      padding: 9px;
      border-radius: 8px;
    }
    .save-btn {
      width: 100%;
      background: #00f2fe;
      color: #030712;
      border: none;
      padding: 11px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="title" id="display-title">JARVIS AI</div>
    <button class="settings-btn" onclick="openSettings()">⚙️</button>
  </div>

  <div class="visualizer-container" id="reactor-container">
    <div class="arc-reactor">
      <div class="inner-core"></div>
    </div>
  </div>

  <div class="status-box">
    <div id="status-text">SYSTEM STANDBY</div>
    <div id="chat-transcript">Pehle Settings (⚙️) me API Key daalein, fir Start dabayein.</div>
  </div>

  <button class="start-btn" id="start-btn" onclick="initJarvis()">START JARVIS</button>

  <div class="modal" id="settings-modal">
    <div class="modal-content">
      <h3>JARVIS SETTINGS</h3>
      <div class="input-group">
        <label>Wake Word (Naam)</label>
        <input type="text" id="cfg-name" value="Jarvis">
      </div>
      <div class="input-group">
        <label>Wake Jawab (Response)</label>
        <input type="text" id="cfg-reply" value="Ji boss, bolo">
      </div>
      <div class="input-group">
        <label>Aapka Naam (Title)</label>
        <input type="text" id="cfg-boss" value="Boss">
      </div>
      <div class="input-group">
        <label>Gemini API Key</label>
        <input type="password" id="cfg-key" placeholder="Paste API Key here">
      </div>
      <button class="save-btn" onclick="saveSettings()">SAVE SETTINGS</button>
    </div>
  </div>

  <script>
    let config = {
      name: localStorage.getItem('j_name') || 'Jarvis',
      reply: localStorage.getItem('j_reply') || 'Ji boss, bolo',
      boss: localStorage.getItem('j_boss') || 'Boss',
      apiKey: localStorage.getItem('j_key') || ''
    };

    document.getElementById('cfg-name').value = config.name;
    document.getElementById('cfg-reply').value = config.reply;
    document.getElementById('cfg-boss').value = config.boss;
    document.getElementById('cfg-key').value = config.apiKey;

    let recognition;
    let isListening = false;
    let isAwaitingCommand = false;
    let synth = window.speechSynthesis;

    const reactor = document.getElementById('reactor-container');
    const statusText = document.getElementById('status-text');
    const transcriptText = document.getElementById('chat-transcript');

    function openSettings() {
      document.getElementById('settings-modal').style.display = 'flex';
    }

    function saveSettings() {
      config.name = document.getElementById('cfg-name').value.trim();
      config.reply = document.getElementById('cfg-reply').value.trim();
      config.boss = document.getElementById('cfg-boss').value.trim();
      config.apiKey = document.getElementById('cfg-key').value.trim();

      localStorage.setItem('j_name', config.name);
      localStorage.setItem('j_reply', config.reply);
      localStorage.setItem('j_boss', config.boss);
      localStorage.setItem('j_key', config.apiKey);

      document.getElementById('display-title').innerText = config.name.toUpperCase() + ' AI';
      document.getElementById('settings-modal').style.display = 'none';
      speak("Settings saved, " + config.boss);
    }

    // Android Chrome Audio Unlocker
    function initJarvis() {
      if (!config.apiKey) {
        alert("Pehle ⚙️ (Settings) par dabakar apni Gemini API Key paste kijiye!");
        openSettings();
        return;
      }

      if (!('webkitSpeechRecognition' in window)) {
        alert("Speech recognition is browser me nahi chalta. Chrome use karein.");
        return;
      }

      // Unlock phone audio
      const dummy = new SpeechSynthesisUtterance('');
      synth.speak(dummy);

      document.getElementById('start-btn').style.display = 'none';
      
      recognition = new webkitSpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = false;
      recognition.lang = 'hi-IN';

      recognition.onstart = () => {
        isListening = true;
        reactor.className = 'visualizer-container listening';
        statusText.innerText = `SUN RAHA HOON: Boliye "Hey ${config.name}"`;
      };

      recognition.onresult = async (event) => {
        const lastIndex = event.results.length - 1;
        const text = event.results[lastIndex][0].transcript.trim().toLowerCase();
        transcriptText.innerText = `Aapne bola: "${text}"`;

        if (synth.speaking) {
          synth.cancel();
          reactor.className = 'visualizer-container listening';
        }

        const wakeWord = config.name.toLowerCase();

        // Wake word trigger
        if (text.includes(wakeWord) || text.includes("hey " + wakeWord)) {
          isAwaitingCommand = true;
          speak(config.reply);
          return;
        }

        if (isAwaitingCommand) {
          isAwaitingCommand = false;
          handleUserQuery(text);
        }
      };

      recognition.onerror = (e) => {
        console.log("Mic error:", e.error);
        statusText.innerText = "Mic Issue: " + e.error;
      };

      recognition.onend = () => {
        if (isListening) {
          try { recognition.start(); } catch(err){}
        }
      };

      recognition.start();
      speak(`System online. Hello ${config.boss}`);
    }

    function speak(textToSpeak) {
      if (synth.speaking) synth.cancel();
      const utterance = new SpeechSynthesisUtterance(textToSpeak);
      
      // Auto voice selector for Android
      const voices = synth.getVoices();
      const hindiVoice = voices.find(v => v.lang.includes('hi') || v.lang.includes('IN'));
      if (hindiVoice) utterance.voice = hindiVoice;

      utterance.rate = 1.05; // Fast human-like speed
      utterance.pitch = 1.0;

      utterance.onstart = () => {
        reactor.className = 'visualizer-container speaking';
        statusText.innerText = `JARVIS BOL RAHA HAI...`;
      };

      utterance.onend = () => {
        reactor.className = 'visualizer-container listening';
        statusText.innerText = `SUN RAHA HOON: Boliye "Hey ${config.name}"`;
      };

      synth.speak(utterance);
    }

    async function handleUserQuery(query) {
      if (query.includes("youtube")) {
        speak("Opening YouTube, boss.");
        window.open("https://www.youtube.com", "_blank");
        return;
      }
      if (query.includes("whatsapp")) {
        speak("Opening WhatsApp, boss.");
        window.location.href = "whatsapp://";
        return;
      }

      statusText.innerText = "Jarvis soch raha hai...";

      const systemPrompt = `You are ${config.name}, talking face-to-face with your ${config.boss}.
Keep replies very direct, warm, human, fast and conversational in Hinglish.
Empathize with human feelings. You know UP Board Class 11 literature completely.
Answer in 2-3 crisp spoken sentences like a real human companion. No markdown stars.`;

      try {
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${config.apiKey}`;
        const response = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [{ role: "user", parts: [{ text: systemPrompt + "\nUser said: " + query }] }]
          })
        });

        const data = await response.json();
        if (data.candidates && data.candidates[0].content.parts[0].text) {
          let reply = data.candidates[0].content.parts[0].text;
          reply = reply.replace(/[*#_]/g, '');
          transcriptText.innerText = "Jarvis: " + reply;
          speak(reply);
        } else {
          speak("Maaf kijiye boss, dobara kahiye?");
        }
      } catch (err) {
        statusText.innerText = "Connection Error! Check API Key.";
        speak("Boss, API key ya internet check kijiye.");
      }
    }
  </script>
</body>
</html>
